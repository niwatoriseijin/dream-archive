const sfx={
 bell(){tone(659,1,{type:'triangle',v:.35});tone(1318,.6,{v:.1});tone(523,1.4,{at:.55,type:'triangle',v:.35});tone(1046,.8,{at:.55,v:.1});},
 openDoor(){tone(140,.9,{type:'sawtooth',to:380,v:.12});noise(.9,{ft:'lowpass',f:500,v:.2});},
 closeDoor(){tone(300,.5,{type:'sawtooth',to:120,v:.1});tone(70,.3,{at:.5,v:.6});noise(.15,{at:.5,ft:'lowpass',f:300,v:.6});},
 slap(){noise(.12,{f:2500,v:.9});noise(.35,{f:900,to:200,v:.7,at:.02});tone(160,.25,{to:40,v:.7});tone(2400,.08,{type:'square',v:.15});},
 rip(){noise(.35,{ft:'highpass',f:1200,to:6000,v:.5});tone(1400,.7,{type:'sine',to:200,v:.2,at:.05});},
 pain(){tone(520,.3,{type:'triangle',to:240,v:.3});tone(380,.5,{type:'triangle',to:150,v:.3,at:.35});},
 step(){noise(.06,{ft:'lowpass',f:400,v:.5});}
};
let bi=0;const notes=[220,261.6,329.6,261.6,220,246.9,293.7,246.9,196,233,293.7,233,220,261.6,329.6,440];
setInterval(()=>{if(!ac||muted)return;const f=notes[bi%16];tone(f,.5,{type:'triangle',v:.07});if(bi%4==0)tone(f/2,1,{type:'sine',v:.12});if(bi%16==15)tone(1760,1.2,{v:.03});bi++;},320);
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;out.gain.value=muted?0:.7;$('mute').textContent=muted?'🔇':'🔊';};
const btn=$('btn'),CR=$('crowd'),door=$('door'),scene=$('scene');
const ask=l=>new Promise(r=>{btn.textContent=l;btn.hidden=false;const go=()=>{btn.hidden=true;document.onpointerdown=null;r();};btn.onpointerdown=go;document.onpointerdown=e=>{if(e.target.id!='mute')go();};});
const costumes=['pumpkin','ghost','vampire','zombie','witch'];
function fly(emoji,rect,i){const e=document.createElement('div');e.className='fly';if(emoji[0]=='<')e.innerHTML=emoji;else e.textContent=emoji;
 const sr=scene.getBoundingClientRect();e.style.left=(rect.left-sr.left+(Math.random()*30-10))+'px';e.style.top=(rect.top-sr.top)+'px';scene.appendChild(e);
 const dx=-(80+Math.random()*220),dy=-(100+Math.random()*200);
 e.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${-360-Math.random()*400}deg) scale(1.1)`,opacity:1,offset:.6},{transform:`translate(${dx*1.3}px,${dy+500}px) rotate(-900deg) scale(.8)`,opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>e.remove();}
async function visit(){
 await sleep(300+Math.random()*600);
 $('bell').classList.add('ring');sfx.bell();await sleep(900);$('bell').classList.remove('ring');
 await ask('🚪 ドアを開ける');
 sfx.openDoor();door.classList.add('open');await sleep(500);
 const sp=Math.random();let ty=[];if(sp<.07)ty=['pizza'];else if(sp<.2)ty=rnd([['grandpa'],['grandma'],['grandpa','grandma']]);else for(let i=rnd([1,1,2,2,3]);i>0;i--)ty.push(rnd(costumes));const k=ty.length;CR.className='c'+k;CR.innerHTML='';const ps=[];for(const c of ty){const p=document.createElement('div');p.className='pp';p.dataset.c=c;p.innerHTML=mk(c,Math.random()*360|0);CR.appendChild(p);ps.push(p);}
 
 void CR.offsetWidth;ps.forEach((p,i)=>setTimeout(()=>p.classList.add('in'),i*100));tone(330,.15,{type:'square',v:.08});await sleep(300);if(ty.every(x=>costumes.includes(x)))await say('トリックオアトリート');
 await ask('🖐️ ビンタ！');
 sfx.slap();$('ct').textContent=rnd(['バチィン！','バッチーン！','ビシィッ！','パァン！']);$('cutin').classList.add('on');
 await sleep(350);$('cutin').classList.remove('on');
 n++;$('cnt').textContent=n;
 
 ps.forEach(p=>{p.classList.remove('in');p.classList.add('hit');});scene.classList.add('shake');setTimeout(()=>scene.classList.remove('shake'),450);
 sfx.rip();ps.forEach(p=>{const r=p.querySelector('svg').getBoundingClientRect(),cs=p.querySelector('.cos');fly(`<svg viewBox='0 -10 100 200' style='width:${r.width}px;height:${r.height}px'>${cs.outerHTML}</svg>`,r);cs.remove();for(let i=0;i<3;i++)fly(rnd(['✨','💥','⭐','🍬']),r);});
 ps.forEach((p,i)=>{p.querySelector('.calm').style.display='none';p.querySelector('.pain').style.display='block';['grandpa','grandma'].includes(p.dataset.c)?say('オーマイガー',i):say(Math.random()<.85?rnd(['うわぁー','うわぁー','うわぁー','ぎゃあー']):'いてぇー',i);});
 await sleep(350);sfx.pain();if(Math.random()<.2)say('いてぇー',1);await sleep(800);
 ps.forEach(p=>{p.classList.remove('hit');p.classList.add('out','walk');});
 for(let i=0;i<5;i++){sfx.step();await sleep(200);}
 CR.innerHTML='';
 door.classList.remove('open');sfx.closeDoor();await sleep(500);
}
$('start').onclick=async()=>{init();ac.resume();try{const u=new SpeechSynthesisUtterance('あ');u.volume=0;speechSynthesis.speak(u)}catch(e){}$('start').remove();while(true)await visit();};
</script></body></html>
