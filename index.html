<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dream Archive</title>
<style>
:root{--desk:#008080;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#004848}}
:root[data-theme="dark"]{--desk:#004848}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--desk);overflow:hidden;font:13px "MS Gothic","Osaka-Mono",monospace;color:#000;user-select:none;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;z-index:20;background:#000;color:#c8c8c8;padding:calc(20px + env(safe-area-inset-top,0px)) 16px;white-space:pre-wrap;line-height:1.7;animation:fk .15s infinite}
#boot.gl{animation:gl .35s}
@keyframes fk{50%{opacity:.94}}
@keyframes gl{30%{transform:skewX(8deg) translateX(10px);filter:invert(1)}60%{transform:skewX(-6deg);filter:hue-rotate(90deg)}}
#desk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
#desk::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0002 2px 3px)}
.win{width:100%;max-width:520px;height:min(100%,680px);background:#c0c0c0;border:2px outset #fff;display:flex;flex-direction:column;box-shadow:4px 4px 0 #0006;padding:3px}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 6px;display:flex;justify-content:space-between;font-weight:700}
.bar{display:flex;gap:6px;align-items:center;padding:5px 2px}
.bar button{font:inherit;background:#c0c0c0;border:2px outset #fff;padding:2px 8px}.bar button:active{border-style:inset}.bar button:disabled{color:#888}
#path{flex:1;background:#fff;border:2px inset #fff;padding:2px 6px}
#list{flex:1;overflow-y:auto;background:#fff;border:2px inset #fff}
.r{display:flex;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px dotted #bbb;cursor:pointer}
.r:active,.r:hover{background:#000080;color:#fff}
.r i{width:20px;height:15px;background:#f0d048;border:1px solid #806000;flex:none}
.r.fil i{width:15px;height:19px;background:#fff;border:1px solid #000;border-top-right-radius:6px}
.r span{color:#06c;width:64px;flex:none}.r:hover span,.r:active span{color:#9cf}
.r b{flex:1;font-weight:400}.r em{font-style:normal;opacity:.6;font-size:11px}.dim{opacity:.45}
.st{padding:4px 6px;border:2px inset #fff;margin-top:4px;font-size:11px;min-height:24px}
#game{position:fixed;inset:0;display:none;background:#cdeee9}
#game::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#0000 45%,#bfeee866 80%,#e8fffb99)}
#game.yel{background:#b5a248}
#game.mal{background:#2a1a50}
#game.mal::after{background:radial-gradient(ellipse at 50% 40%,#0000 45%,#2a143055 85%,#10082099)}
#game.pnk{background:#ffd9e8}
#game.pnk::after{background:radial-gradient(ellipse at 50% 40%,#0000 50%,#ff9cc544 85%,#b86aa088)}
#game.par{background:#5a4a86}
#game.par::after{background:radial-gradient(ellipse at 50% 40%,#0000 45%,#2a104a55 85%,#10062099)}
#game.grd{background:#9bb578}
#game.grd::after{background:radial-gradient(ellipse at 50% 40%,#0000 45%,#2a4a2044 85%,#10240e88)}
#game.off{background:#7d765a}
#game.off::after{background:radial-gradient(ellipse at 50% 40%,#0000 40%,#1a2a1a55 80%,#08140899)}
#game.cln{background:#e3f0f4}
#game.cln::after{background:radial-gradient(ellipse at 50% 40%,#0000 55%,#bcd8e255 90%,#8fb4c488)}
#game.aer{background:#79cfff}
#game.aer::after{background:radial-gradient(ellipse at 50% 40%,#0000 55%,#2a7ad644 90%,#10459a77)}
#game.fld{background:#e9d9a8}
#game.fld::after{background:radial-gradient(ellipse at 50% 40%,#0000 50%,#6a501e33 88%,#3a2a0e88)}
#game.end{background:#1a1511}
#game.end::after{background:radial-gradient(ellipse at 50% 40%,#0000 50%,#00000066 90%,#000000aa)}
#game.yel::after{background:radial-gradient(ellipse at 50% 40%,#0000 40%,#5a4a0a44 80%,#2a2000aa)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#x{position:absolute;z-index:3;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:0;background:#ffffff55;color:#fff;font-size:22px;line-height:1;opacity:.5}
</style></head><body>
<div id="boot"></div>
<div id="desk"><div class="win"><div class="tb"><span>Dream_Archive.exe</span><span>_ □ ×</span></div><div class="bar"><button id="up">↑ 上へ</button><div id="path"></div></div><div id="list"></div><div class="st" id="st"></div></div></div>

<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v;
/* ===== AUDIO ===== */
let AC,OUT,REV,NB;
function au(){if(!AC){try{AC=new(window.AudioContext||webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);const n=AC.sampleRate*1.8,b=AC.createBuffer(2,n,AC.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}REV=AC.createConvolver();REV.buffer=b;const g=AC.createGain();g.gain.value=.3;REV.connect(g);g.connect(OUT);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}}AC&&AC.state=='suspended'&&AC.resume()}
const A={L:[],
out(n,v=1,rev=.3){const g=AC.createGain();g.gain.value=v;n.connect(g);g.connect(OUT);if(rev){const r=AC.createGain();r.gain.value=rev;g.connect(r);r.connect(REV)}},

tick(d,v,type,f,q=1,rev=.2){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),e=AC.createGain();s.buffer=NB;fl.type=type;fl.frequency.value=f;fl.Q.value=q;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(e);A.out(e,1,rev);s.start(t,R(0,1.5));s.stop(t+d+.02)},
loop(type,f,q=1){if(!AC)return{set(){}};const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=0;s.connect(fl);fl.connect(g);A.out(g,1,.25);s.start();A.L.push(s);return{set(v,fr){const t=AC.currentTime;g.gain.setTargetAtTime(v,t,.04);if(fr)fl.frequency.setTargetAtTime(fr,t,.05)}}},
stop(){A.L.forEach(s=>{try{s.stop()}catch(e){}});A.L=[]}};

/* ===== INPUT / LOOP ===== */
let W,H,G=null,ptr=0,last=0,px,py,sensOn=0,shT=0;const cv=$('#cv'),c=cv.getContext('2d'),T={x:0,y:0};
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);G&&G.init()}
addEventListener('resize',()=>G&&rs());
cv.onpointerdown=e=>{au();px=e.clientX;py=e.clientY;ptr=1;cv.setPointerCapture(e.pointerId);G&&G.down&&G.down(px,py)};
cv.onpointermove=e=>{if(!ptr||!G)return;const x=e.clientX,y=e.clientY;G.move&&G.move(x,y,x-px,y-py);px=x;py=y};
cv.onpointerup=cv.onpointercancel=()=>{if(!ptr)return;ptr=0;G&&G.up&&G.up(px,py)};
function sens(){if(sensOn)return;sensOn=1;const f=()=>{addEventListener('deviceorientation',e=>{if(e.gamma==null)return;T.x=cl(e.gamma/40,-1,1);T.y=cl((e.beta-40)/40,-1,1)});let l=0;addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z),n=Date.now();if(Math.abs(m-l)>22&&n-shT>600){shT=n;G&&G.shake&&G.shake()}l=m})};const D=window.DeviceMotionEvent;if(D&&D.requestPermission)D.requestPermission().then(r=>r=='granted'&&f()).catch(()=>{});else f()}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft')T.x=-1;if(k=='ArrowRight')T.x=1;if(k=='ArrowUp')T.y=-1;if(k=='ArrowDown')T.y=1;if(k==' '&&G&&G.shake)G.shake();if(k=='Escape')quit()});
addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))T.x=T.y=0});
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;G&&G.frame(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);

/* ===== SHARED: tiles + water heightfield ===== */
function tiles(g,w,h,ts){g.fillStyle='#b6c9c8';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=ts)for(let x=0;x<w;x+=ts){const v=R(-6,6)|0,q=g.createLinearGradient(x,y,x+ts,y+ts);q.addColorStop(0,`rgb(${240+v},${248+v/2},${246+v/2})`);q.addColorStop(1,`rgb(${214+v},${230+v},${230+v})`);g.fillStyle=q;g.fillRect(x+ts*.04,y+ts*.04,ts*.92,ts*.92)}}
function Water(){const gw=110,gh=Math.round(gw*H/W);let a=new Float32Array(gw*gh),b=new Float32Array(gw*gh);
const fl=document.createElement('canvas');fl.width=gw;fl.height=gh;const fg=fl.getContext('2d');tiles(fg,gw,gh,gw/6);const F=fg.getImageData(0,0,gw,gh).data;
const oc=document.createElement('canvas');oc.width=gw;oc.height=gh;const ox=oc.getContext('2d'),im=ox.createImageData(gw,gh),O=im.data;O.set(F);
return{hit(x,y,s,r=2){const cx=x/W*gw,cy=y/H*gh,Q=Math.ceil(r*2.5);for(let j=-Q;j<=Q;j++)for(let i=-Q;i<=Q;i++){const X=(cx+i)|0,Y=(cy+j)|0;if(X>0&&Y>0&&X<gw-1&&Y<gh-1)a[Y*gw+X]+=s*Math.exp(-(i*i+j*j)/(r*r))}},
edge(tx,ty){if(Math.abs(tx)>.08)for(let y=2;y<gh-2;y++)a[y*gw+(tx>0?gw-3:2)]+=Math.abs(tx)*.5;if(Math.abs(ty)>.08)for(let x=2;x<gw-2;x++)a[(ty>0?gh-3:2)*gw+x]+=Math.abs(ty)*.5},
step(){for(let y=1;y<gh-1;y++)for(let x=1;x<gw-1;x++){const i=y*gw+x;b[i]=((a[i-1]+a[i+1]+a[i-gw]+a[i+gw])/2-b[i])*.993}const t=a;a=b;b=t},

/* ===== G01 WATER ===== */
const gWater=()=>{let w,sn,tk=0;return{init(){w=Water();sn=A.loop('bandpass',900,.8)},
down(x,y){w.hit(x,y,45,2.2);A.blip(R(380,520),R(150,220),.2,.16)},
move(x,y,vx,vy){const s=Math.hypot(vx,vy);w.hit(x+vx*.7,y+vy*.7,s*.5,2);w.hit(x-vx*.7,y-vy*.7,-s*.35,2);sn.set(Math.min(.3,s*.006),500+s*14);if(s>28&&Math.random()<.2)A.blip(R(500,900),R(200,400),.12,.08)},
up(){sn.set(0)},
shake(){for(let i=0;i<10;i++)w.hit(R(0,W),R(0,H),R(40,80),2.5);A.tick(.5,.4,'bandpass',1200,.6,.5);A.blip(300,120,.4,.2)},
frame(){w.edge(T.x,T.y);w.step();w.step();w.draw();if(Math.abs(T.x)+Math.abs(T.y)>.15&&(tk+=1)%14==0)A.tick(.4,.05,'lowpass',700,.5,.5)}}};

/* ===== G02 POOL TILE ===== */
const gTile=()=>{let tx,D=[],rub,ts,dp=devicePixelRatio||1,t=0;
const mk=(x,y,r)=>D.push({x,y,r,vx:0,vy:0,tr:0});
function tex(){tx=document.createElement('canvas');tx.width=W*dp;tx.height=H*dp;const g=tx.getContext('2d');g.scale(dp,dp);ts=Math.max(48,W/6);tiles(g,W,H,ts);g.lineWidth=2;for(let y=0;y<H;y+=ts)for(let x=0;x<W;x+=ts){g.strokeStyle='rgba(255,255,255,.85)';g.beginPath();g.moveTo(x+ts*.06,y+ts*.94);g.lineTo(x+ts*.06,y+ts*.06);g.lineTo(x+ts*.94,y+ts*.06);g.stroke();g.strokeStyle='rgba(110,150,150,.3)';g.beginPath();g.moveTo(x+ts*.94,y+ts*.1);g.lineTo(x+ts*.94,y+ts*.94);g.lineTo(x+ts*.1,y+ts*.94);g.stroke()}
const s=g.createLinearGradient(0,0,W,H);s.addColorStop(0,'rgba(255,255,255,.5)');s.addColorStop(.4,'rgba(255,255,255,0)');s.addColorStop(.7,'rgba(255,255,255,.3)');s.addColorStop(1,'rgba(150,200,200,.1)');g.fillStyle=s;g.fillRect(0,0,W,H)}
return{init(){tex();D=[];for(let i=0;i<55;i++)mk(R(0,W),R(0,H),R(2.5,9));for(let i=0;i<5;i++)mk(R(0,W),R(0,H*.6),R(11,16));rub=A.loop('highpass',3500,2)},
down(x,y){const k=((x/ts|0)+(y/ts|0)*7)%7;A.tick(.03,.5,'highpass',2500,1,.3);[1650,2630,3900].forEach((f,i)=>A.blip(f*(1+k*.04),f*(1+k*.04)*.97,.28-i*.07,.07,'sine',.4));D.forEach(d=>{const dx=d.x-x,dy=d.y-y,q=Math.hypot(dx,dy);if(q<70){d.vx+=dx/q*140;d.vy+=dy/q*140-80}});for(let i=0;i<4;i++){mk(x+R(-10,10),y+R(-10,10),R(1.5,3.5));const d=D[D.length-1];d.vx=R(-120,120);d.vy=R(-150,40)}},
move(x,y,vx,vy){const s=Math.hypot(vx,vy);rub.set(Math.min(.22,s*.005),3000+s*40);D.forEach(d=>{if(Math.hypot(d.x-x,d.y-y)<d.r+22){d.x+=vx*.9;d.y+=vy*.9;d.vx=vx*20;d.vy=vy*20}})},
up(){rub.set(0)},shake(){D.forEach(d=>{d.vx+=R(-300,300);d.vy+=R(-300,100)});A.tick(.25,.3,'highpass',2500)},
frame(dt){t+=dt;if(D.length<48&&Math.random()<.1)mk(R(0,W),R(0,H*.5),R(2.5,6));const gx=T.x*900,gy=700+T.y*350;
D.forEach(d=>{const k=cl((d.r-8.5)/12,0,1);d.vx+=gx*k*dt;d.vy+=gy*k*dt;d.vx*=k?.99:.85;d.vy*=k?.99:.85;const sp=Math.hypot(d.vx,d.vy);d.x+=d.vx*dt;d.y+=d.vy*dt;if(sp>45&&d.r>9&&(d.tr+=sp*dt)>16){d.tr=0;d.r*=.992;mk(d.x-d.vx/sp*d.r,d.y-d.vy/sp*d.r,R(1.6,2.6))}});
for(let i=0;i<D.length;i++)for(let j=i+1;j<D.length;j++){const a=D[i],b=D[j];if(!a||!b)continue;if(Math.hypot(a.x-b.x,a.y-b.y)<(a.r+b.r)*.75){const A2=a.r*a.r,B2=b.r*b.r,s=A2+B2;a.x=(a.x*A2+b.x*B2)/s;a.y=(a.y*A2+b.y*B2)/s;a.vx=(a.vx*A2+b.vx*B2)/s;a.vy=(a.vy*A2+b.vy*B2)/s;a.r=Math.sqrt(s);D.splice(j,1);j--;if(a.r>5)A.blip(R(900,1400),R(500,800),.07,.05)}}
D=D.filter(d=>d.y<H+30&&d.x>-30&&d.x<W+30).slice(-110);
c.drawImage(tx,0,0,W,H);
D.forEach(d=>{const{x,y,r}=d;c.fillStyle='rgba(40,70,80,.16)';c.beginPath();c.ellipse(x+r*.25,y+r*.4,r*1.05,r*.95,0,0,7);c.fill();
c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();c.translate(x,y);c.scale(-1.15,-1.15);c.drawImage(tx,(x-r)*dp,(y-r)*dp,2*r*dp,2*r*dp,-r,-r,2*r,2*r);c.restore();
const q=c.createRadialGradient(x,y,r*.4,x,y,r);q.addColorStop(0,'rgba(220,255,255,.05)');q.addColorStop(1,'rgba(30,80,95,.32)');c.fillStyle=q;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.stroke();
c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=Math.max(1,r*.12);c.beginPath();c.arc(x,y,r*.7,.5,2.6);c.stroke();c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.ellipse(x-r*.38,y-r*.4,r*.2,r*.12,-.7,0,7);c.fill()})}}};

/* ===== G03 POOL DUCK (soft body on water) ===== */
const gDuck=()=>{let w,P=[],R0,cx,cy,t=0,pr=0,prv=0,hold=0,bx=0,by=0,b0x=0,b0y=0,Dx=0,Dy=0,rp,sq,rt=0;
const CP=[[-1.05,-.15],[-.7,-.05],[-.3,-.05],[.05,-.25],[.1,-.7],[.35,-.98],[.65,-.85],[.78,-.62],[1.1,-.55],[.95,-.42],[.68,-.38],[.6,-.2],[.82,.1],[.75,.45],[.3,.62],[-.3,.65],[-.75,.45]];
const disp=(x,y)=>{let sx=0,sy=0,sw=0;P.forEach(p=>{const q=1/((p.x-x)**2+(p.y-y)**2+.02)**2;sx+=p.dx*q;sy+=p.dy*q;sw+=q});return[sx/sw,sy/sw]};
const loc=(x,y)=>{bx=(x-cx)/R0;by=(y-cy-Math.sin(t*1.4)*5)/R0};
function body(){const m=P.length,X=i=>P[i%m].x+P[i%m].dx,Y=i=>P[i%m].y+P[i%m].dy;c.beginPath();c.moveTo((X(0)+X(1))/2,(Y(0)+Y(1))/2);for(let i=1;i<=m;i++)c.quadraticCurveTo(X(i),Y(i),(X(i)+X(i+1))/2,(Y(i)+Y(i+1))/2);c.closePath()}
function sim(h){const m=P.length;for(let i=0;i<m;i++){const p=P[i],a=P[(i+m-1)%m],b=P[(i+1)%m];let fx=-40*p.dx-6*p.vx+120*((a.dx+b.dx)/2-p.dx),fy=-40*p.dy-6*p.vy+120*((a.dy+b.dy)/2-p.dy);
